[project]
name = "triplet-kicad-agent"
version = "0.1.0"
description = "AI-powered KiCad PCB co-designer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
    "uvicorn>=0.30",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
kicad-mcp = "backend.kicad_mcp.server:mcp.run"

[tool.ruff]
line-length = 100
target-version = "py312"
